<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 392" width="1200" height="392" role="img" aria-labelledby="t d">
  <title id="t">Likhith Raju, Full Stack Developer</title>
  <desc id="d">Animated banner showing the name Likhith Raju, the role Full Stack Developer, the focus areas Spring Boot, Kafka and AI agents, a small Java code sample, and a scrolling ticker of achievements.</desc>

  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d" opacity="0.55"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="392" rx="16"/></clipPath>
    <clipPath id="tickerClip"><rect x="1" y="345" width="1198" height="46"/></clipPath>
    <linearGradient id="nameFill" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#e6edf3"/>
      <stop offset="0.35" stop-color="#58a6ff"/>
      <stop offset="0.65" stop-color="#d2a8ff"/>
      <stop offset="1" stop-color="#e6edf3"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="600 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <g id="tk" class="mono" font-size="14">
      <rect x="24" y="363" width="8" height="8" transform="rotate(45 28 367)" fill="#d08a4e"/>
      <text x="44" y="373"><tspan class="muted">HACKERRANK ORCHESTRATE  </tspan><tspan class="fg">BRONZE · TOP 135</tspan></text>
      <rect x="464" y="363" width="8" height="8" transform="rotate(45 468 367)" fill="#58a6ff"/>
      <text x="484" y="373"><tspan class="muted">CRED BACKEND CHALLENGE  </tspan><tspan class="fg">#39 / 2,590</tspan></text>
      <rect x="904" y="363" width="8" height="8" transform="rotate(45 908 367)" fill="#ffa657"/>
      <text x="924" y="373"><tspan class="muted">LEETCODE  </tspan><tspan class="fg">1794 · 400+ SOLVED</tspan></text>
      <rect x="1344" y="363" width="8" height="8" transform="rotate(45 1348 367)" fill="#d2a8ff"/>
      <text x="1364" y="373"><tspan class="muted">CODECHEF  </tspan><tspan class="fg">3 STAR</tspan></text>
      <rect x="1784" y="363" width="8" height="8" transform="rotate(45 1788 367)" fill="#7ee787"/>
      <text x="1804" y="373"><tspan class="muted">STACK  </tspan><tspan class="fg">JAVA · SPRING BOOT · KAFKA · LANGGRAPH</tspan></text>
    </g>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .muted { fill: #8b949e; }
    .fg { fill: #e6edf3; }
    .accent { fill: #58a6ff; }
    .kw { fill: #ff7b72; }
    .an { fill: #d2a8ff; }
    .ty { fill: #ffa657; }
    .st { fill: #a5d6ff; }
    .fn { fill: #7ee787; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .line { opacity: 0; animation: reveal 0.4s ease-out forwards; }
    .l1 { animation-delay: 0.2s; } .l2 { animation-delay: 0.45s; }
    .l3 { animation-delay: 0.7s; } .l4 { animation-delay: 0.95s; }
    .l5 { animation-delay: 1.2s; } .l6 { animation-delay: 1.45s; }
    .l7 { animation-delay: 1.7s; }
    .stream { fill: none; stroke-width: 1.5; stroke-dasharray: 60 380; opacity: 0.35; animation: flow 7s linear infinite; }
    .s2 { animation-duration: 10s; } .s3 { animation-duration: 5.5s; } .s4 { animation-duration: 12s; }
    .glitch { opacity: 0; }
    .g1 { fill: #ff7b72; animation: glitchA 6s steps(1) infinite; }
    .g2 { fill: #58a6ff; animation: glitchB 6s steps(1) infinite; }
    .ticker { animation: ticker 44s linear infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
    @keyframes flow { to { stroke-dashoffset: -880; } }
    @keyframes ticker { to { transform: translateX(-2200px); } }
    @keyframes glitchA {
      0%, 91% { opacity: 0; transform: translate(0, 0); }
      92% { opacity: 0.8; transform: translate(-5px, 1px); }
      94% { opacity: 0.8; transform: translate(4px, -2px); }
      96%, 100% { opacity: 0; transform: translate(0, 0); }
    }
    @keyframes glitchB {
      0%, 91% { opacity: 0; transform: translate(0, 0); }
      92% { opacity: 0.8; transform: translate(5px, -1px); }
      94% { opacity: 0.8; transform: translate(-4px, 2px); }
      96%, 100% { opacity: 0; transform: translate(0, 0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .cursor, .stream, .g1, .g2, .ticker { animation: none; }
      .line { animation: none; opacity: 1; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="392" fill="#0d1117"/>
    <rect width="1200" height="392" fill="url(#dots)"/>

    <!-- Data streams -->
    <path class="stream" stroke="#58a6ff" d="M0 30 H1200"/>
    <path class="stream s2" stroke="#d2a8ff" d="M0 122 H1200"/>
    <path class="stream s3" stroke="#7ee787" d="M0 236 H1200"/>
    <path class="stream s4" stroke="#58a6ff" d="M0 318 H1200"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="391" rx="16" fill="none" stroke="#30363d"/>

  <!-- Identity -->
  <text x="64" y="104" class="mono muted" font-size="18">// hello, world</text>
  <g class="sans" font-size="64" font-weight="700" letter-spacing="-1.5">
    <text x="64" y="172" class="glitch g1">Likhith Raju</text>
    <text x="64" y="172" class="glitch g2">Likhith Raju</text>
    <text x="64" y="172" fill="url(#nameFill)">Likhith Raju</text>
  </g>
  <text x="64" y="218" class="mono accent" font-size="26">Full Stack Developer<tspan class="cursor">_</tspan></text>

  <g class="mono" font-size="15" text-anchor="middle">
    <rect x="64" y="244" width="132" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="130" y="266" class="fg">Spring Boot</text>
    <rect x="208" y="244" width="84" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="250" y="266" class="fg">Kafka</text>
    <rect x="304" y="244" width="112" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
    <text x="360" y="266" class="fg">AI Agents</text>
  </g>

  <!-- Code window -->
  <rect x="624" y="40" width="512" height="256" rx="12" fill="#161b22" stroke="#30363d"/>
  <line x1="624" y1="78" x2="1136" y2="78" stroke="#30363d"/>
  <circle cx="648" cy="59" r="6" fill="#ff5f57"/>
  <circle cx="668" cy="59" r="6" fill="#febc2e"/>
  <circle cx="688" cy="59" r="6" fill="#28c840"/>
  <text x="880" y="64" class="mono muted" font-size="13" text-anchor="middle">Likhith.java</text>

  <g class="mono" font-size="15">
    <text x="648" y="112" class="line l1"><tspan class="an">@RestController</tspan></text>
    <text x="648" y="138" class="line l2"><tspan class="kw">public class</tspan><tspan class="ty"> Likhith</tspan><tspan class="fg"> {</tspan></text>
    <text x="666" y="176" class="line l3"><tspan class="an">@GetMapping</tspan><tspan class="fg">(</tspan><tspan class="st">"/stack"</tspan><tspan class="fg">)</tspan></text>
    <text x="666" y="202" class="line l4"><tspan class="ty">List&lt;String&gt;</tspan><tspan class="fn"> stack</tspan><tspan class="fg">() {</tspan></text>
    <text x="684" y="228" class="line l5"><tspan class="kw">return</tspan><tspan class="fg"> List.of(</tspan><tspan class="st">"Java"</tspan><tspan class="fg">, </tspan><tspan class="st">"Kafka"</tspan><tspan class="fg">, </tspan><tspan class="st">"LangGraph"</tspan><tspan class="fg">);</tspan></text>
    <text x="666" y="254" class="line l6"><tspan class="fg">}</tspan></text>
    <text x="648" y="280" class="line l7"><tspan class="fg">}</tspan></text>
  </g>

  <!-- Ticker -->
  <g clip-path="url(#card)">
    <rect x="0" y="344" width="1200" height="48" fill="#161b22"/>
    <line x1="0" y1="344" x2="1200" y2="344" stroke="#30363d"/>
  </g>
  <g clip-path="url(#tickerClip)">
    <g class="ticker">
      <use xlink:href="#tk" href="#tk"/>
      <use xlink:href="#tk" href="#tk" x="2200"/>
    </g>
  </g>
</svg>
