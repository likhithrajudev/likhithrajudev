    <clipPath id="card"><rect width="600" height="372" rx="16"/></clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .muted { fill: #8b949e; }
    .fg { fill: #e6edf3; }
    .chip { opacity: 0.7; animation: glow 7.4s ease-in-out infinite; }
    @keyframes glow { 0%, 12%, 100% { opacity: 0.7; } 5% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .chip { animation: none; opacity: 0.9; } }
  </style>
