<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 372" width="600" height="372" role="img" aria-labelledby="t d">
  <title id="t">Things I think about</title>
  <desc id="d">Wall of engineering concepts: race conditions, row-level locks, REST APIs, distributed locking, idempotency, retries, message queues, async workers, RBAC, schema design, transactions, microservices, p95 latency, load testing, observability, LangGraph agents, evals, agent harnesses, horizontal scaling, failure handling.</desc>
