<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 372" width="600" height="372" role="img" aria-labelledby="t d">
  <title id="t">whoami</title>
  <desc id="d">Terminal session. whoami: Likhith Raju, full stack developer with a backend focus. Role: Associate Software Developer at Webknot. Based in Bengaluru, India. Degree: B.E. Information Science, RNSIT. Focus areas: concurrency, reliability, agents, evals.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d" opacity="0.55"/>
    </pattern>
    <clipPath id="card"><rect width="600" height="372" rx="16"/></clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .muted { fill: #8b949e; }
    .fg { fill: #e6edf3; }
    .prompt { fill: #7ee787; }
    .key { fill: #58a6ff; }
    .dir { fill: #d2a8ff; }
    .row { opacity: 0; animation: reveal 0.25s ease-out forwards; }
    .cursor { fill: #e6edf3; animation: blink 1.1s steps(1) infinite; }
    @keyframes reveal { to { opacity: 1; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .row { animation: none; opacity: 1; }
      .cursor { animation: none; }
    }
  </style>
  <g clip-path="url(#card)">
    <rect width="600" height="372" fill="#0d1117"/>
    <rect width="600" height="372" fill="url(#dots)"/>
  </g>
  <rect x="0.5" y="0.5" width="599" height="371" rx="16" fill="none" stroke="#30363d"/>
  <rect x="0.5" y="0.5" width="599" height="44" rx="16" fill="#161b22" clip-path="url(#card)"/>
  <rect x="1" y="28" width="598" height="17" fill="#161b22"/>
  <line x1="0" y1="45" x2="600" y2="45" stroke="#30363d"/>
  <circle cx="26" cy="23" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="23" r="6" fill="#febc2e"/>
  <circle cx="66" cy="23" r="6" fill="#28c840"/>
  <text x="300" y="28" class="mono muted" font-size="13" text-anchor="middle">likhith@bengaluru: ~</text>
  <g class="mono" font-size="14.5">
    <text x="28" y="92" class="row" style="animation-delay:0.30s" xml:space="preserve"><tspan class="prompt">$ </tspan><tspan class="fg">whoami</tspan></text>
    <text x="28" y="119" class="row" style="animation-delay:0.85s" xml:space="preserve"><tspan class="fg">likhith raju</tspan><tspan class="muted"> · full stack developer, backend focus</tspan></text>
    <text x="28" y="146" class="row" style="animation-delay:1.15s" xml:space="preserve"><tspan class="prompt">$ </tspan><tspan class="fg">cat now.txt</tspan></text>
    <text x="28" y="173" class="row" style="animation-delay:1.70s" xml:space="preserve"><tspan class="key">role    </tspan><tspan class="fg">Associate Software Developer @ Webknot</tspan></text>
    <text x="28" y="200" class="row" style="animation-delay:2.00s" xml:space="preserve"><tspan class="key">based   </tspan><tspan class="fg">Bengaluru, India</tspan></text>
    <text x="28" y="227" class="row" style="animation-delay:2.30s" xml:space="preserve"><tspan class="key">degree  </tspan><tspan class="fg">B.E. Information Science, RNSIT</tspan></text>
    <text x="28" y="254" class="row" style="animation-delay:2.60s" xml:space="preserve"><tspan class="prompt">$ </tspan><tspan class="fg">ls focus/</tspan></text>
    <text x="28" y="281" class="row" style="animation-delay:3.15s" xml:space="preserve"><tspan class="dir">concurrency/  reliability/  agents/  evals/</tspan></text>
    <text x="28" y="308" class="row" style="animation-delay:3.45s" xml:space="preserve"><tspan class="prompt">$ </tspan><tspan class="fg">uptime</tspan></text>
    <text x="28" y="335" class="row" style="animation-delay:4.00s" xml:space="preserve"><tspan class="fg">shipping since 2025 </tspan><tspan class="cursor">_</tspan></text>
  </g>
</svg>
