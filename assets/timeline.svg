<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 232" width="1200" height="232" role="img" aria-labelledby="t d">
  <title id="t">Timeline</title>
  <desc id="d">Timeline. December 2021: started B.E. in Information Science at RNSIT. February 2025: Full Stack Developer Intern at Mphasis. July 2025: graduated. February 2026: Associate Software Developer at Webknot. October 2026: bronze medal at HackerRank Orchestrate.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d" opacity="0.55"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="232" rx="16"/></clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .muted { fill: #8b949e; }
    .fg { fill: #e6edf3; }
    .ring { transform-origin: 1104px 116px; animation: ping 2s ease-out infinite; }
    @keyframes ping { from { transform: scale(1); opacity: 0.9; } to { transform: scale(2.6); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .ring { animation: none; opacity: 0; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="232" fill="#0d1117"/>
    <rect width="1200" height="232" fill="url(#dots)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="231" rx="16" fill="none" stroke="#30363d"/>
  <line x1="48" y1="116" x2="1104" y2="116" stroke="#30363d" stroke-width="2"/>
  <line class="ahead" x1="1104" y1="116" x2="1152" y2="116" stroke="#30363d" stroke-width="2" stroke-dasharray="4 6"/>
  <circle r="5" fill="#58a6ff"><animateMotion dur="6s" repeatCount="indefinite" path="M48 116 H1104"/></circle>
  <circle cx="130" cy="116" r="9" fill="#0d1117" stroke="#8b949e" stroke-width="3"/>
  <line x1="130" y1="104" x2="130" y2="92" stroke="#30363d"/>
  <text x="130" y="44" text-anchor="middle" class="mono" font-size="13" fill="#8b949e">Dec 2021</text>
  <text x="130" y="66" text-anchor="middle" class="sans fg" font-size="15" font-weight="600">Started B.E. in</text>
  <text x="130" y="84" text-anchor="middle" class="sans muted" font-size="14">Information Science, RNSIT</text>
  <circle cx="330" cy="116" r="9" fill="#0d1117" stroke="#58a6ff" stroke-width="3"/>
  <line x1="330" y1="128" x2="330" y2="140" stroke="#30363d"/>
  <text x="330" y="160" text-anchor="middle" class="mono" font-size="13" fill="#58a6ff">Feb 2025</text>
  <text x="330" y="182" text-anchor="middle" class="sans fg" font-size="15" font-weight="600">Full Stack Developer</text>
  <text x="330" y="200" text-anchor="middle" class="sans muted" font-size="14">Intern, Mphasis</text>
  <circle cx="550" cy="116" r="9" fill="#0d1117" stroke="#8b949e" stroke-width="3"/>
  <line x1="550" y1="104" x2="550" y2="92" stroke="#30363d"/>
  <text x="550" y="44" text-anchor="middle" class="mono" font-size="13" fill="#8b949e">Jul 2025</text>
  <text x="550" y="66" text-anchor="middle" class="sans fg" font-size="15" font-weight="600">Graduated</text>
  <text x="550" y="84" text-anchor="middle" class="sans muted" font-size="14">B.E., RNSIT</text>
  <circle cx="770" cy="116" r="9" fill="#0d1117" stroke="#7ee787" stroke-width="3"/>
  <line x1="770" y1="128" x2="770" y2="140" stroke="#30363d"/>
  <text x="770" y="160" text-anchor="middle" class="mono" font-size="13" fill="#7ee787">Feb 2026</text>
  <text x="770" y="182" text-anchor="middle" class="sans fg" font-size="15" font-weight="600">Associate Software</text>
  <text x="770" y="200" text-anchor="middle" class="sans muted" font-size="14">Developer, Webknot</text>
  <circle cx="990" cy="116" r="9" fill="#0d1117" stroke="#d08a4e" stroke-width="3"/>
  <line x1="990" y1="104" x2="990" y2="92" stroke="#30363d"/>
  <text x="990" y="44" text-anchor="middle" class="mono" font-size="13" fill="#d08a4e">Oct 2026</text>
  <text x="990" y="66" text-anchor="middle" class="sans fg" font-size="15" font-weight="600">Bronze medal</text>
  <text x="990" y="84" text-anchor="middle" class="sans muted" font-size="14">HackerRank Orchestrate</text>
  <circle class="now" cx="1104" cy="116" r="7" fill="#7ee787"/>
  <circle class="ring" cx="1104" cy="116" r="7" fill="none" stroke="#7ee787" stroke-width="2"/>
  <text x="1104" y="92" text-anchor="middle" class="mono" font-size="13" fill="#7ee787">now</text>
</svg>
